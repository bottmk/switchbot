name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:
    inputs:
      register_webhook:
        description: 'Register/update SwitchBot webhook after deploy'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install

      - name: Initialize D1 if needed
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if grep -q "REPLACE_WITH_ACTUAL_ID" wrangler.toml; then
            echo "Creating D1 database switchbot-logs..."
            CREATE_OUT=$(npx wrangler d1 create switchbot-logs 2>&1 || true)
            echo "$CREATE_OUT"
            DB_ID=$(echo "$CREATE_OUT" | grep -oE '[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}' | head -1)
            if [ -z "$DB_ID" ]; then
              echo "Create may have failed (already exists?). Listing existing..."
              DB_ID=$(npx wrangler d1 list --json | python3 -c "import sys,json; out=json.load(sys.stdin); print(next((d.get('uuid') or d.get('database_id') for d in out if d.get('name')=='switchbot-logs'), ''))")
            fi
            if [ -z "$DB_ID" ]; then
              echo "ERROR: could not determine D1 database_id"
              exit 1
            fi
            sed -i "s/REPLACE_WITH_ACTUAL_ID/$DB_ID/" wrangler.toml
            echo "Set database_id=$DB_ID"
            echo "new=true" >> $GITHUB_OUTPUT
          else
            echo "D1 already configured in wrangler.toml"
            echo "new=false" >> $GITHUB_OUTPUT
          fi

      - name: Apply D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute switchbot-logs --remote --file=docs/db_setup.sql

      - name: Set Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SWITCHBOT_API_TOKEN: ${{ secrets.SWITCHBOT_API_TOKEN }}
          SWITCHBOT_API_SECRET: ${{ secrets.SWITCHBOT_API_SECRET }}
          SWITCHBOT_WEBHOOK_SECRET: ${{ secrets.SWITCHBOT_WEBHOOK_SECRET }}
          DEVICES: ${{ secrets.DEVICES }}
        run: |
          set +e
          fail=0
          put_secret() {
            local name="$1"
            local val="$2"
            if [ -z "$val" ]; then
              echo "::error::Secret $name is empty in env"; fail=1; return
            fi
            echo "--- putting $name (${#val} chars) ---"
            printf '%s' "$val" | npx wrangler secret put "$name" 2>&1
            local rc=$?
            echo "--- $name exit=$rc ---"
            if [ $rc -ne 0 ]; then fail=1; fi
          }
          put_secret SWITCHBOT_API_TOKEN      "$SWITCHBOT_API_TOKEN"
          put_secret SWITCHBOT_API_SECRET     "$SWITCHBOT_API_SECRET"
          put_secret SWITCHBOT_WEBHOOK_SECRET "$SWITCHBOT_WEBHOOK_SECRET"
          put_secret DEVICES                  "$DEVICES"
          if [ $fail -ne 0 ]; then exit 1; fi

      - name: Deploy Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deploy.log
          WORKER_URL=$(grep -oE 'https://switchbot-temperature-logger\.[^[:space:]]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$WORKER_URL" ]; then
            echo "WARNING: could not parse Worker URL from deploy output"
          fi
          echo "worker_url=$WORKER_URL" >> $GITHUB_OUTPUT
          echo "## Deployed" >> $GITHUB_STEP_SUMMARY
          echo "- Worker URL: $WORKER_URL" >> $GITHUB_STEP_SUMMARY

      - name: Commit database_id if new
        if: steps.d1.outputs.new == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wrangler.toml
          if ! git diff --cached --quiet; then
            git commit -m "Set D1 database_id from deploy workflow"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Register SwitchBot webhook
        if: inputs.register_webhook == true
        env:
          SWITCHBOT_API_TOKEN: ${{ secrets.SWITCHBOT_API_TOKEN }}
          SWITCHBOT_API_SECRET: ${{ secrets.SWITCHBOT_API_SECRET }}
          SWITCHBOT_WEBHOOK_SECRET: ${{ secrets.SWITCHBOT_WEBHOOK_SECRET }}
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: node scripts/register-webhook.js

      - name: Verify D1 row count
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute switchbot-logs --remote \
            --command "SELECT COUNT(*) AS n FROM temperature_logs" 2>&1 | tee -a /tmp/deploy-report.txt || true

      - name: Build deploy report
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SWITCHBOT_API_TOKEN: ${{ secrets.SWITCHBOT_API_TOKEN }}
          SWITCHBOT_API_SECRET: ${{ secrets.SWITCHBOT_API_SECRET }}
          SWITCHBOT_WEBHOOK_SECRET: ${{ secrets.SWITCHBOT_WEBHOOK_SECRET }}
          DEVICES: ${{ secrets.DEVICES }}
          JOB_STATUS: ${{ job.status }}
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
          NEW_DB: ${{ steps.d1.outputs.new }}
        run: |
          {
            echo "## Job status: $JOB_STATUS"
            echo
            echo "### Deploy outputs"
            echo "- Worker URL: $WORKER_URL"
            echo "- D1 newly created this run: $NEW_DB"
            echo
            echo "### Workspace wrangler.toml"
            cat wrangler.toml
            echo
            echo "### Deploy log (last 100 lines)"
            tail -100 deploy.log 2>/dev/null || echo "(no deploy.log)"
            echo
            echo "### Verify section captured above"
          } > /tmp/deploy-report.txt
          # Scrub any secret values
          python3 - <<'PY'
          import os
          with open('/tmp/deploy-report.txt') as f: t = f.read()
          for n in ['CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID','SWITCHBOT_API_TOKEN','SWITCHBOT_API_SECRET','SWITCHBOT_WEBHOOK_SECRET','DEVICES']:
              v = os.environ.get(n,'')
              if v: t = t.replace(v, f'<<{n}>>')
          with open('/tmp/deploy-report.txt','w') as f: f.write(t)
          PY

      - name: Post deploy report to tracker PR (or fallback Issue)
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const post = require('./scripts/post-tracker.cjs');
            await post({ github, context, core, logPath: '/tmp/deploy-report.txt', kind: 'deploy-${{ job.status }}' });
