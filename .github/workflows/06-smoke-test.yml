name: "06: Smoke test → Issue"

# Reads D1 status, sends a test webhook, and posts everything to a GitHub
# Issue so Claude can read it via MCP.

on:
  workflow_dispatch:
  push:
    branches: [claude/switchbot-turso-setup-nk30n]
    paths:
      - 'src/**'
      - '.github/workflows/06-smoke-test.yml'
      - 'scripts/**'

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  loop-guard:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - id: check
        run: |
          AUTHORS=$(git log -3 --format='%ae')
          CLAUDE=$(echo "$AUTHORS" | grep -c 'noreply@anthropic.com' || true)
          echo "Recent authors:"
          echo "$AUTHORS"
          echo "Claude consecutive: $CLAUDE"
          if [ "$CLAUDE" -ge 3 ]; then
            echo "::warning::3+ consecutive Claude commits — halting auto-run to prevent loop."
            echo "go=false" >> $GITHUB_OUTPUT
          else
            echo "go=true" >> $GITHUB_OUTPUT
          fi

  smoke:
    needs: loop-guard
    if: needs.loop-guard.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install --no-audit --no-fund

      - name: Run smoke checks, capture all output
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SWITCHBOT_WEBHOOK_SECRET: ${{ secrets.SWITCHBOT_WEBHOOK_SECRET }}
        run: |
          set +e
          LOG=/tmp/smoke.log
          : > "$LOG"
          exec > >(tee -a "$LOG") 2>&1

          echo "=== Get Worker subdomain ==="
          SUB_RESP=$(curl -sS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")
          SUB=$(echo "$SUB_RESP" | python3 -c "import sys,json; r=json.load(sys.stdin); print(r.get('result',{}).get('subdomain',''))")
          echo "Subdomain: $SUB"
          WORKER_URL="https://switchbot-temperature-logger.${SUB}.workers.dev"
          echo "Worker URL: $WORKER_URL"

          echo
          echo "=== Worker reachability (root, expects 405) ==="
          curl -sS -o /tmp/r -w "HTTP %{http_code}\n" "$WORKER_URL/" -X GET
          echo "Body:"; cat /tmp/r; echo

          echo
          echo "=== Worker reachability with wrong secret (expects 401) ==="
          curl -sS -o /tmp/r -w "HTTP %{http_code}\n" "$WORKER_URL/webhook/wrong-secret" \
            -X POST -H "Content-Type: application/json" -d '{"eventType":"test"}'
          echo "Body:"; cat /tmp/r; echo

          echo
          echo "=== Worker reachability with correct secret, non-changeReport (expects 200 {ok,ignored}) ==="
          curl -sS -o /tmp/r -w "HTTP %{http_code}\n" "$WORKER_URL/webhook/$SWITCHBOT_WEBHOOK_SECRET" \
            -X POST -H "Content-Type: application/json" -d '{"eventType":"smoke-test"}'
          echo "Body:"; cat /tmp/r; echo

          echo
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "=== Send a fake changeReport (should INSERT a webhook row) ==="
            curl -sS -o /tmp/r -w "HTTP %{http_code}\n" "$WORKER_URL/webhook/$SWITCHBOT_WEBHOOK_SECRET" \
              -X POST -H "Content-Type: application/json" \
              -d '{"eventType":"changeReport","eventVersion":"1","context":{"deviceType":"WoMeterPlus","deviceMac":"SMOKE:TEST:00:00:00:00","temperature":22.5,"humidity":55,"battery":99,"timeOfSample":1747600000}}'
            echo "Body:"; cat /tmp/r; echo
          else
            echo "=== Skipping fake changeReport on push trigger (avoid polluting D1) ==="
          fi

          echo
          echo "=== D1 table list ==="
          npx wrangler d1 execute switchbot-logs --remote \
            --command "SELECT name FROM sqlite_master WHERE type='table'"

          echo
          echo "=== D1 row count by source ==="
          npx wrangler d1 execute switchbot-logs --remote \
            --command "SELECT source, COUNT(*) AS n FROM temperature_logs GROUP BY source"

          echo
          echo "=== D1 latest 10 rows ==="
          npx wrangler d1 execute switchbot-logs --remote \
            --command "SELECT id, device_id, timestamp, temperature, humidity, absolute_humidity, room, battery, source FROM temperature_logs ORDER BY id DESC LIMIT 10"

      - name: Scrub secrets from log
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SWITCHBOT_API_TOKEN: ${{ secrets.SWITCHBOT_API_TOKEN }}
          SWITCHBOT_API_SECRET: ${{ secrets.SWITCHBOT_API_SECRET }}
          SWITCHBOT_WEBHOOK_SECRET: ${{ secrets.SWITCHBOT_WEBHOOK_SECRET }}
          DEVICES: ${{ secrets.DEVICES }}
        run: |
          python3 - <<'PY'
          import os
          try:
              with open('/tmp/smoke.log') as f: t = f.read()
          except FileNotFoundError:
              t = '(no log)'
          for n in ['CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID','SWITCHBOT_API_TOKEN','SWITCHBOT_API_SECRET','SWITCHBOT_WEBHOOK_SECRET','DEVICES']:
              v = os.environ.get(n,'')
              if v: t = t.replace(v, f'<<{n}>>')
          with open('/tmp/smoke.log','w') as f: f.write(t)
          PY

      - name: Post smoke result to tracker PR (or fallback Issue)
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const post = require('./scripts/post-tracker.js');
            await post({ github, context, core, logPath: '/tmp/smoke.log', kind: 'smoke' });
