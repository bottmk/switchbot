name: "06: Smoke test → Issue"

# Reads D1 status, sends a test webhook, and posts everything to a GitHub
# Issue so Claude can read it via MCP.

on:
  workflow_dispatch:
  push:
    branches: [claude/switchbot-turso-setup-nk30n]
    paths:
      - 'src/**'
      - '.github/workflows/06-smoke-test.yml'
      - 'scripts/**'

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: read

jobs:
  loop-guard:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
      recent: ${{ steps.check.outputs.recent }}
      s1_files: ${{ steps.check.outputs.s1_files }}
      s1_net: ${{ steps.check.outputs.s1_net }}
      s2_dup: ${{ steps.check.outputs.s2_dup }}
      s3_fail: ${{ steps.check.outputs.s3_fail }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 15
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual trigger — bypassing loop guard."
            echo "go=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          AUTHORS=$(git log -10 --format='%ae')
          CLAUDE=$(echo "$AUTHORS" | grep -c 'noreply@anthropic.com' || true)
          echo "Recent authors:"
          echo "$AUTHORS"
          echo "Claude consecutive: $CLAUDE"
          RECENT=$(git log -10 --format='- %h %ae: %s')
          {
            echo "recent<<EOF"
            echo "$RECENT"
            echo "EOF"
          } >> $GITHUB_OUTPUT
          # Author count is already computed as $CLAUDE
          # S1: file-set churn over last 8 Claude commits
          N=8
          S1_FILES=$(git log -n $N --author='noreply@anthropic.com' --no-merges --name-only --pretty=format: | sed '/^$/d' | sort -u | wc -l)
          S1_COMMITS=$(git log -n $N --author='noreply@anthropic.com' --no-merges --oneline | wc -l)
          S1_NET=$(git log -n $N --author='noreply@anthropic.com' --no-merges --shortstat --pretty=format: | grep -oE '[0-9]+ insertion' | grep -oE '[0-9]+' | awk '{s+=$1} END{print s+0}')
          echo "S1: files=$S1_FILES commits=$S1_COMMITS net=$S1_NET"
          echo "s1_files=$S1_FILES" >> $GITHUB_OUTPUT
          echo "s1_net=$S1_NET" >> $GITHUB_OUTPUT
          THRASH=0
          if [ "$S1_COMMITS" -ge 8 ] && [ "$S1_FILES" -le 3 ] && [ "$S1_NET" -lt 20 ]; then THRASH=1; fi

          # S2: commit message duplication over last 6 Claude commits
          N2=6
          S2_DUP=$(git log -n $N2 --author='noreply@anthropic.com' --no-merges --format='%s' \
            | sed -E 's/[0-9a-f]{7,}//g; s/[[:space:]]+/ /g' | tr 'A-Z' 'a-z' \
            | sort | uniq -c | sort -rn | awk 'NR==1{print $1+0}')
          DUPMSG=0
          if [ "${S2_DUP:-0}" -ge 4 ]; then DUPMSG=1; fi
          echo "S2: dup_count=$S2_DUP"
          echo "s2_dup=$S2_DUP" >> $GITHUB_OUTPUT

          # S3: CI failure streak — same workflow failing repeatedly on this branch
          S3=0
          FAIL=0
          if command -v gh >/dev/null 2>&1 && [ -n "$GH_TOKEN" ]; then
            FAIL=$(gh run list --workflow="$GITHUB_WORKFLOW" --branch="$GITHUB_REF_NAME" \
              --limit 6 --json conclusion -q '[.[] | select(.conclusion=="failure")] | length' 2>/dev/null || echo 0)
            if [ "${FAIL:-0}" -ge 5 ]; then S3=1; fi
            echo "S3: failures_in_6=$FAIL"
          else
            echo "S3: skipped (gh or token unavailable)"
          fi
          echo "s3_fail=$FAIL" >> $GITHUB_OUTPUT

          # Author count ($CLAUDE) is kept in output for visibility only — no longer a gate.
          if { [ "$THRASH" -eq 1 ] && [ "$DUPMSG" -eq 1 ]; } || [ "$S3" -eq 1 ]; then
            echo "::warning::Loop guard tripped: (S1 thrash AND S2 msg-dup) OR S3 CI failure streak."
            echo "go=false" >> $GITHUB_OUTPUT
            if [ "$S3" -eq 1 ]; then
              echo "halt_reason=ci_failure_streak" >> $GITHUB_OUTPUT
            else
              echo "halt_reason=thrash+dup" >> $GITHUB_OUTPUT
            fi
          else
            echo "go=true" >> $GITHUB_OUTPUT
          fi
      - name: Comment on tracker PR (halted)
        if: steps.check.outputs.go == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', head: `${context.repo.owner}:${branch}`, per_page: 1,
            });
            if (!prs.data.length) { console.log('No tracker PR'); return; }
            const body = [
              `### 🛑 [auto-halted] ${context.workflow} run #${context.runNumber}`,
              '',
              `Loop guard tripped: (S1 file-set churn AND S2 commit-message duplication) OR S3 CI failure streak (files=${{ steps.check.outputs.s1_files }}, net=${{ steps.check.outputs.s1_net }} insertions, dup=${{ steps.check.outputs.s2_dup }}, ci_failures_in_6=${{ steps.check.outputs.s3_fail }}).`,
              '',
              'Last 10 commits:',
              '```',
              `${{ steps.check.outputs.recent }}`,
              '```',
              '',
              'To resume auto-runs on push, commit something as a non-Claude author (e.g. a small README edit).',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: prs.data[0].number, body,
            });

  smoke:
    needs: loop-guard
    if: needs.loop-guard.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install --no-audit --no-fund

      - name: Run smoke checks, capture all output
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SWITCHBOT_WEBHOOK_SECRET: ${{ secrets.SWITCHBOT_WEBHOOK_SECRET }}
        run: |
          set +e
          LOG=/tmp/smoke.log
          : > "$LOG"
          exec > >(tee -a "$LOG") 2>&1

          echo "=== Get Worker subdomain ==="
          SUB_RESP=$(curl -sS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")
          SUB=$(echo "$SUB_RESP" | python3 -c "import sys,json; r=json.load(sys.stdin); print(r.get('result',{}).get('subdomain',''))")
          echo "Subdomain: $SUB"
          WORKER_URL="https://switchbot-temperature-logger.${SUB}.workers.dev"
          echo "Worker URL: $WORKER_URL"

          echo
          echo "=== Worker reachability (root, expects 405) ==="
          curl -sS -o /tmp/r -w "HTTP %{http_code}\n" "$WORKER_URL/" -X GET
          echo "Body:"; cat /tmp/r; echo

          echo
          echo "=== Worker reachability with wrong secret (expects 401) ==="
          curl -sS -o /tmp/r -w "HTTP %{http_code}\n" "$WORKER_URL/webhook/wrong-secret" \
            -X POST -H "Content-Type: application/json" -d '{"eventType":"test"}'
          echo "Body:"; cat /tmp/r; echo

          echo
          echo "=== Worker reachability with correct secret, non-changeReport (expects 200 {ok,ignored}) ==="
          curl -sS -o /tmp/r -w "HTTP %{http_code}\n" "$WORKER_URL/webhook/$SWITCHBOT_WEBHOOK_SECRET" \
            -X POST -H "Content-Type: application/json" -d '{"eventType":"smoke-test"}'
          echo "Body:"; cat /tmp/r; echo

          echo
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "=== Send a fake changeReport (should INSERT a webhook row) ==="
            curl -sS -o /tmp/r -w "HTTP %{http_code}\n" "$WORKER_URL/webhook/$SWITCHBOT_WEBHOOK_SECRET" \
              -X POST -H "Content-Type: application/json" \
              -d '{"eventType":"changeReport","eventVersion":"1","context":{"deviceType":"WoMeterPlus","deviceMac":"SMOKE:TEST:00:00:00:00","temperature":22.5,"humidity":55,"battery":99,"timeOfSample":1747600000}}'
            echo "Body:"; cat /tmp/r; echo
          else
            echo "=== Skipping fake changeReport on push trigger (avoid polluting D1) ==="
          fi

          echo
          echo "=== D1 table list ==="
          npx wrangler d1 execute switchbot-logs --remote \
            --command "SELECT name FROM sqlite_master WHERE type='table'"

          echo
          echo "=== D1 row count by source ==="
          npx wrangler d1 execute switchbot-logs --remote \
            --command "SELECT source, COUNT(*) AS n FROM temperature_logs GROUP BY source"

          echo
          echo "=== D1 latest 10 rows ==="
          npx wrangler d1 execute switchbot-logs --remote \
            --command "SELECT id, device_id, timestamp, temperature, humidity, absolute_humidity, room, battery, source FROM temperature_logs ORDER BY id DESC LIMIT 10"

      - name: Scrub secrets from log
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SWITCHBOT_API_TOKEN: ${{ secrets.SWITCHBOT_API_TOKEN }}
          SWITCHBOT_API_SECRET: ${{ secrets.SWITCHBOT_API_SECRET }}
          SWITCHBOT_WEBHOOK_SECRET: ${{ secrets.SWITCHBOT_WEBHOOK_SECRET }}
          DEVICES: ${{ secrets.DEVICES }}
        run: |
          python3 - <<'PY'
          import os
          try:
              with open('/tmp/smoke.log') as f: t = f.read()
          except FileNotFoundError:
              t = '(no log)'
          for n in ['CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID','SWITCHBOT_API_TOKEN','SWITCHBOT_API_SECRET','SWITCHBOT_WEBHOOK_SECRET','DEVICES']:
              v = os.environ.get(n,'')
              if v: t = t.replace(v, f'<<{n}>>')
          with open('/tmp/smoke.log','w') as f: f.write(t)
          PY

      - name: Post smoke result to tracker PR (or fallback Issue)
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const post = require('./scripts/post-tracker.cjs');
            await post({ github, context, core, logPath: '/tmp/smoke.log', kind: 'smoke' });
