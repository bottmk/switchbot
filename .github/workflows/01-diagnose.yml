name: "01: Diagnose"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show runner environment
        run: |
          echo "=== Runner ==="
          uname -a
          echo "=== Node ==="
          which node && node --version
          echo "=== npm ==="
          which npm && npm --version
          echo "=== Python ==="
          which python3 && python3 --version
          echo "=== Repository tree ==="
          ls -la
          echo "=== Workflow file ==="
          ls -la .github/workflows/
          echo "=== package.json ==="
          cat package.json

      - name: Check secrets presence (length only, no values)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SWITCHBOT_API_TOKEN: ${{ secrets.SWITCHBOT_API_TOKEN }}
          SWITCHBOT_API_SECRET: ${{ secrets.SWITCHBOT_API_SECRET }}
          SWITCHBOT_WEBHOOK_SECRET: ${{ secrets.SWITCHBOT_WEBHOOK_SECRET }}
          DEVICES: ${{ secrets.DEVICES }}
        run: |
          check() {
            local name="$1"; local val="$2"
            if [ -z "$val" ]; then
              echo "❌ $name : MISSING (empty or not registered)"
            else
              echo "✅ $name : present (${#val} chars)"
            fi
          }
          check CLOUDFLARE_API_TOKEN      "$CLOUDFLARE_API_TOKEN"
          check CLOUDFLARE_ACCOUNT_ID     "$CLOUDFLARE_ACCOUNT_ID"
          check SWITCHBOT_API_TOKEN       "$SWITCHBOT_API_TOKEN"
          check SWITCHBOT_API_SECRET      "$SWITCHBOT_API_SECRET"
          check SWITCHBOT_WEBHOOK_SECRET  "$SWITCHBOT_WEBHOOK_SECRET"
          check DEVICES                   "$DEVICES"

      - name: Verify Cloudflare API token via wrangler whoami
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm install --no-audit --no-fund
          echo "=== wrangler version ==="
          npx wrangler --version
          echo "=== wrangler whoami ==="
          npx wrangler whoami || echo "whoami failed (see above)"

      - name: Verify Account ID matches
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Hit account-scoped API to verify the ID is correct
          STATUS=$(curl -sS -o /tmp/cf-resp -w "%{http_code}" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID")
          echo "HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Account ID verify failed:"
            cat /tmp/cf-resp
            exit 1
          fi
          echo "Account ID verified"

      - name: Validate DEVICES JSON
        env:
          DEVICES: ${{ secrets.DEVICES }}
        run: |
          echo "$DEVICES" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert isinstance(d, list), 'DEVICES must be a JSON array'
          for i, x in enumerate(d):
              assert isinstance(x, dict), f'devices[{i}] not a dict'
              assert 'deviceId' in x and 'room' in x, f'devices[{i}] missing deviceId/room'
              print(f'  device[{i}]: deviceId={x[\"deviceId\"][:6]}... room={x[\"room\"]}')
          print(f'DEVICES OK ({len(d)} entries)')
          "
