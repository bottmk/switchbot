name: "01: Diagnose"

on:
  workflow_dispatch:
  push:
    branches: [claude/switchbot-turso-setup-nk30n]
    paths:
      - 'src/**'
      - 'docs/db_setup.sql'
      - 'wrangler.toml'
      - '.github/workflows/01-diagnose.yml'
      - 'scripts/**'

concurrency:
  group: diagnose-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: read

jobs:
  loop-guard:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
      recent: ${{ steps.check.outputs.recent }}
      s1_files: ${{ steps.check.outputs.s1_files }}
      s1_net: ${{ steps.check.outputs.s1_net }}
      s2_dup: ${{ steps.check.outputs.s2_dup }}
      s3_fail: ${{ steps.check.outputs.s3_fail }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 15
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual trigger — bypassing loop guard."
            echo "go=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          AUTHORS=$(git log -10 --format='%ae')
          CLAUDE=$(echo "$AUTHORS" | grep -c 'noreply@anthropic.com' || true)
          echo "Recent authors:"
          echo "$AUTHORS"
          echo "Claude consecutive: $CLAUDE"
          RECENT=$(git log -10 --format='- %h %ae: %s')
          {
            echo "recent<<EOF"
            echo "$RECENT"
            echo "EOF"
          } >> $GITHUB_OUTPUT
          # Author count is already computed as $CLAUDE
          # S1: file-set churn over last 8 Claude commits
          N=8
          S1_FILES=$(git log -n $N --author='noreply@anthropic.com' --no-merges --name-only --pretty=format: | sed '/^$/d' | sort -u | wc -l)
          S1_COMMITS=$(git log -n $N --author='noreply@anthropic.com' --no-merges --oneline | wc -l)
          S1_NET=$(git log -n $N --author='noreply@anthropic.com' --no-merges --shortstat --pretty=format: | grep -oE '[0-9]+ insertion' | grep -oE '[0-9]+' | awk '{s+=$1} END{print s+0}')
          echo "S1: files=$S1_FILES commits=$S1_COMMITS net=$S1_NET"
          echo "s1_files=$S1_FILES" >> $GITHUB_OUTPUT
          echo "s1_net=$S1_NET" >> $GITHUB_OUTPUT
          THRASH=0
          if [ "$S1_COMMITS" -ge 8 ] && [ "$S1_FILES" -le 3 ] && [ "$S1_NET" -lt 20 ]; then THRASH=1; fi

          # S2: commit message duplication over last 6 Claude commits
          N2=6
          S2_DUP=$(git log -n $N2 --author='noreply@anthropic.com' --no-merges --format='%s' \
            | sed -E 's/[0-9a-f]{7,}//g; s/[[:space:]]+/ /g' | tr 'A-Z' 'a-z' \
            | sort | uniq -c | sort -rn | awk 'NR==1{print $1+0}')
          DUPMSG=0
          if [ "${S2_DUP:-0}" -ge 4 ]; then DUPMSG=1; fi
          echo "S2: dup_count=$S2_DUP"
          echo "s2_dup=$S2_DUP" >> $GITHUB_OUTPUT

          # S3: CI failure streak — same workflow failing repeatedly on this branch
          S3=0
          FAIL=0
          if command -v gh >/dev/null 2>&1 && [ -n "$GH_TOKEN" ]; then
            FAIL=$(gh run list --workflow="$GITHUB_WORKFLOW" --branch="$GITHUB_REF_NAME" \
              --limit 6 --json conclusion -q '[.[] | select(.conclusion=="failure")] | length' 2>/dev/null || echo 0)
            if [ "${FAIL:-0}" -ge 5 ]; then S3=1; fi
            echo "S3: failures_in_6=$FAIL"
          else
            echo "S3: skipped (gh or token unavailable)"
          fi
          echo "s3_fail=$FAIL" >> $GITHUB_OUTPUT

          if { [ "$CLAUDE" -ge 10 ] && [ "$THRASH" -eq 1 ] && [ "$DUPMSG" -eq 1 ]; } || [ "$S3" -eq 1 ]; then
            echo "::warning::Loop guard tripped: (thrash+dup) or CI failure streak detected."
            echo "go=false" >> $GITHUB_OUTPUT
            if [ "$S3" -eq 1 ]; then
              echo "halt_reason=ci_failure_streak" >> $GITHUB_OUTPUT
            else
              echo "halt_reason=thrash+dup" >> $GITHUB_OUTPUT
            fi
          else
            echo "go=true" >> $GITHUB_OUTPUT
          fi
      - name: Comment on tracker PR (halted)
        if: steps.check.outputs.go == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', head: `${context.repo.owner}:${branch}`, per_page: 1,
            });
            if (!prs.data.length) { console.log('No tracker PR'); return; }
            const body = [
              `### 🛑 [auto-halted] ${context.workflow} run #${context.runNumber}`,
              '',
              `Loop guard tripped: (10+ Claude commits AND file-set churn AND message duplication) OR CI failure streak (files=${{ steps.check.outputs.s1_files }}, net=${{ steps.check.outputs.s1_net }} insertions, dup=${{ steps.check.outputs.s2_dup }}, ci_failures_in_6=${{ steps.check.outputs.s3_fail }}).`,
              '',
              'Last 10 commits:',
              '```',
              `${{ steps.check.outputs.recent }}`,
              '```',
              '',
              'To resume auto-runs on push, commit something as a non-Claude author (e.g. a small README edit).',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: prs.data[0].number, body,
            });

  diagnose:
    needs: loop-guard
    if: needs.loop-guard.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show runner environment
        run: |
          echo "=== Runner ==="
          uname -a
          echo "=== Node ==="
          which node && node --version
          echo "=== npm ==="
          which npm && npm --version
          echo "=== Python ==="
          which python3 && python3 --version
          echo "=== Repository tree ==="
          ls -la
          echo "=== Workflow file ==="
          ls -la .github/workflows/
          echo "=== package.json ==="
          cat package.json

      - name: Check secrets presence (length only, no values)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SWITCHBOT_API_TOKEN: ${{ secrets.SWITCHBOT_API_TOKEN }}
          SWITCHBOT_API_SECRET: ${{ secrets.SWITCHBOT_API_SECRET }}
          SWITCHBOT_WEBHOOK_SECRET: ${{ secrets.SWITCHBOT_WEBHOOK_SECRET }}
          DEVICES: ${{ secrets.DEVICES }}
        run: |
          check() {
            local name="$1"; local val="$2"
            if [ -z "$val" ]; then
              echo "❌ $name : MISSING (empty or not registered)"
            else
              echo "✅ $name : present (${#val} chars)"
            fi
          }
          check CLOUDFLARE_API_TOKEN      "$CLOUDFLARE_API_TOKEN"
          check CLOUDFLARE_ACCOUNT_ID     "$CLOUDFLARE_ACCOUNT_ID"
          check SWITCHBOT_API_TOKEN       "$SWITCHBOT_API_TOKEN"
          check SWITCHBOT_API_SECRET      "$SWITCHBOT_API_SECRET"
          check SWITCHBOT_WEBHOOK_SECRET  "$SWITCHBOT_WEBHOOK_SECRET"
          check DEVICES                   "$DEVICES"

      - name: Verify Cloudflare API token via wrangler whoami
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm install --no-audit --no-fund
          echo "=== wrangler version ==="
          npx wrangler --version
          echo "=== wrangler whoami ==="
          npx wrangler whoami || echo "whoami failed (see above)"

      - name: Verify Account ID matches
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Hit account-scoped API to verify the ID is correct
          STATUS=$(curl -sS -o /tmp/cf-resp -w "%{http_code}" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID")
          echo "HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Account ID verify failed:"
            cat /tmp/cf-resp
            exit 1
          fi
          echo "Account ID verified"

      - name: Validate DEVICES JSON
        env:
          DEVICES: ${{ secrets.DEVICES }}
        run: |
          python3 <<'PY'
          import os, json, re
          val = os.environ.get('DEVICES', '')
          n = len(val)
          # Structural counters (no value leakage)
          print(f"Length: {n}")
          if n == 0:
              print("ERROR: DEVICES secret is empty or unset.")
              raise SystemExit(1)
          print(f"First char:  {val[0]!r}")
          print(f"Last char:   {val[-1]!r}")
          print(f"'[' count: {val.count('[')}")
          print(f"']' count: {val.count(']')}")
          print(f"'{{' count: {val.count('{')}")
          print(f"'}}' count: {val.count('}')}")
          print(f"',' count: {val.count(',')}")
          # Detect common typo patterns without revealing data
          if any(ch in val for ch in '［］｛｝，：　"'.replace('"','')):
              print("WARN: full-width punctuation detected — use half-width [ ] { } , : only")
          if '\n' in val: print("WARN: contains newline(s)")
          if val.strip() != val: print("WARN: leading/trailing whitespace")
          if val.startswith("'") or val.endswith("'"):
              print("WARN: single-quote wrapping the entire value")
          # Try parse
          try:
              d = json.loads(val)
          except json.JSONDecodeError as e:
              print(f"PARSE ERROR: {e}")
              pos = e.pos
              # Print structural context (positions only, not characters)
              print(f"Error position: char {pos} of {n}")
              # Print a histogram-style indicator
              window_start = max(0, pos - 5)
              window_end = min(n, pos + 5)
              print(f"Context window [{window_start}:{window_end}]:")
              ctx = val[window_start:window_end]
              # Only show structural punctuation, mask alphanumerics as 'X'
              safe = ''.join(c if c in '[]{},:" \t' else 'X' for c in ctx)
              print(f"  {safe}")
              print(f"  {' ' * (pos - window_start)}^ here")
              print()
              print("Expected format examples:")
              print('  1 device:  [{"deviceId":"XX:XX:XX:XX:XX:XX","room":"living"}]')
              print('  N devices: [{"deviceId":"...","room":"..."},{"deviceId":"...","room":"..."}]')
              raise SystemExit(1)
          if not isinstance(d, list):
              print(f"ERROR: top-level must be a JSON array, got {type(d).__name__}")
              raise SystemExit(1)
          for i, x in enumerate(d):
              if not isinstance(x, dict):
                  print(f"ERROR: devices[{i}] is {type(x).__name__}, must be object")
                  raise SystemExit(1)
              if 'deviceId' not in x:
                  print(f"ERROR: devices[{i}] missing 'deviceId'")
                  raise SystemExit(1)
              if 'room' not in x:
                  print(f"ERROR: devices[{i}] missing 'room'")
                  raise SystemExit(1)
              did = x['deviceId']
              # Soft-validate MAC format
              if not re.match(r'^[0-9A-Fa-f]{2}([:-]?[0-9A-Fa-f]{2}){5}$', str(did)):
                  print(f"WARN: devices[{i}].deviceId doesn't look like a MAC address")
              print(f"  device[{i}]: deviceId=***(len={len(did)}) room={x['room']!r}")
          print(f"DEVICES OK ({len(d)} entries)")
          PY
