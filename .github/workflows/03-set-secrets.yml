name: "03: Set Cloudflare Worker secrets"

on:
  workflow_dispatch:

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install --no-audit --no-fund

      - name: Put SWITCHBOT_API_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VAL: ${{ secrets.SWITCHBOT_API_TOKEN }}
        run: printf '%s' "$VAL" | npx wrangler secret put SWITCHBOT_API_TOKEN

      - name: Put SWITCHBOT_API_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VAL: ${{ secrets.SWITCHBOT_API_SECRET }}
        run: printf '%s' "$VAL" | npx wrangler secret put SWITCHBOT_API_SECRET

      - name: Put SWITCHBOT_WEBHOOK_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VAL: ${{ secrets.SWITCHBOT_WEBHOOK_SECRET }}
        run: printf '%s' "$VAL" | npx wrangler secret put SWITCHBOT_WEBHOOK_SECRET

      - name: Put DEVICES
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VAL: ${{ secrets.DEVICES }}
        run: printf '%s' "$VAL" | npx wrangler secret put DEVICES

      - name: List secrets (names only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler secret list
