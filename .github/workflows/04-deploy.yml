name: "04: Deploy Worker"

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["01: Diagnose"]
    types: [completed]

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}
          repository: ${{ github.event.workflow_run.head_repository.full_name || github.repository }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install --no-audit --no-fund

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deploy.log
          WORKER_URL=$(grep -oE 'https://switchbot-temperature-logger\.[^[:space:]]+\.workers\.dev' deploy.log | head -1 || true)
          echo "## Deployed" >> $GITHUB_STEP_SUMMARY
          echo "- Worker URL: \`$WORKER_URL\`" >> $GITHUB_STEP_SUMMARY
          echo ""
          echo "Worker URL: $WORKER_URL"

      - name: Show recent Worker logs (5s window)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          timeout 10s npx wrangler tail --format=json switchbot-temperature-logger || true
        continue-on-error: true
