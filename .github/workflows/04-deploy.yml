name: "04: Deploy Worker"

on:
  workflow_dispatch:
  push:
    branches: [claude/switchbot-continuation-90uc17]
    paths:
      - 'src/**'
      - 'wrangler.toml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/04-deploy.yml'
  workflow_run:
    workflows: ["01: Diagnose"]
    types: [completed]
    branches: [claude/switchbot-turso-setup-nk30n, claude/switchbot-continuation-90uc17]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install --no-audit --no-fund

      - name: Sync CONTROL_SECRET (enables /control; skipped if unset)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VAL: ${{ secrets.CONTROL_SECRET }}
        run: |
          if [ -n "$VAL" ]; then
            printf '%s' "$VAL" | npx wrangler secret put CONTROL_SECRET
            echo "CONTROL_SECRET synced to Worker (control enabled)."
          else
            echo "CONTROL_SECRET not set in repo secrets; skipping (control stays disabled)."
          fi

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deploy.log
          WORKER_URL=$(grep -oE 'https://switchbot-temperature-logger\.[^[:space:]]+\.workers\.dev' deploy.log | head -1 || true)
          echo "## Deployed" >> $GITHUB_STEP_SUMMARY
          echo "- Worker URL: \`$WORKER_URL\`" >> $GITHUB_STEP_SUMMARY
          echo ""
          echo "Worker URL: $WORKER_URL"

      - name: Show recent Worker logs (5s window)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          timeout 10s npx wrangler tail --format=json switchbot-temperature-logger || true
        continue-on-error: true
