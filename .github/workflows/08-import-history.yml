name: "08: Import CSV history → D1"

on:
  workflow_dispatch:
    inputs:
      r2_keys:
        description: "Comma-separated R2 object keys to download from switchbot-csv-staging before import (leave blank to skip R2)"
        required: false
        default: ""

concurrency:
  group: import-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund

      - name: Download CSVs from R2
        if: inputs.r2_keys != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p data/historical
          IFS=',' read -ra KEYS <<< "${{ inputs.r2_keys }}"
          for KEY in "${KEYS[@]}"; do
            KEY="$(echo "$KEY" | xargs)"  # trim whitespace
            [ -z "$KEY" ] && continue
            LOCAL="data/historical/$(basename "$KEY")"
            echo "Downloading R2 object: $KEY -> $LOCAL"
            npx wrangler r2 object get "switchbot-csv-staging/$KEY" --file "$LOCAL"
          done
          ls -la data/historical/

      - name: Apply schema additions (idempotent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          # ALTER TABLE ADD COLUMN — fails harmlessly if column exists
          npx wrangler d1 execute switchbot-logs --remote \
            --command "ALTER TABLE temperature_logs ADD COLUMN absolute_humidity_orig REAL" 2>&1 | tail -5
          # CREATE INDEX IF NOT EXISTS — true idempotent
          npx wrangler d1 execute switchbot-logs --remote \
            --command "CREATE UNIQUE INDEX IF NOT EXISTS uniq_temp_logs_dev_ts ON temperature_logs(device_id, timestamp)" 2>&1 | tail -5
          exit 0

      - name: Run importer
        id: import
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SWITCHBOT_API_TOKEN: ${{ secrets.SWITCHBOT_API_TOKEN }}
          SWITCHBOT_API_SECRET: ${{ secrets.SWITCHBOT_API_SECRET }}
        run: |
          set +e
          node scripts/import-csv.mjs 2>&1 | tee /tmp/import.log
          echo "rc=$?" >> /tmp/import.log

      - name: Show row counts after import
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          {
            echo
            echo "=== Row counts by source ==="
            npx wrangler d1 execute switchbot-logs --remote \
              --command "SELECT source, COUNT(*) AS n FROM temperature_logs GROUP BY source"
            echo
            echo "=== Per-device counts ==="
            npx wrangler d1 execute switchbot-logs --remote \
              --command "SELECT device_id, source, COUNT(*) AS n FROM temperature_logs GROUP BY device_id, source ORDER BY device_id, source"
          } 2>&1 | tee -a /tmp/import.log

      - name: Scrub secrets
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SWITCHBOT_API_TOKEN: ${{ secrets.SWITCHBOT_API_TOKEN }}
          SWITCHBOT_API_SECRET: ${{ secrets.SWITCHBOT_API_SECRET }}
          SWITCHBOT_WEBHOOK_SECRET: ${{ secrets.SWITCHBOT_WEBHOOK_SECRET }}
          DEVICES: ${{ secrets.DEVICES }}
        run: |
          python3 - <<'PY'
          import os
          try:
              with open('/tmp/import.log') as f: t = f.read()
          except FileNotFoundError:
              t = '(no log)'
          for n in ['CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID','SWITCHBOT_API_TOKEN','SWITCHBOT_API_SECRET','SWITCHBOT_WEBHOOK_SECRET','DEVICES']:
              v = os.environ.get(n,'')
              if v: t = t.replace(v, f'<<{n}>>')
          with open('/tmp/import.log','w') as f: f.write(t)
          PY

      - name: Post to tracker PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const post = require('./scripts/post-tracker.cjs');
            await post({ github, context, core, logPath: '/tmp/import.log', kind: 'import' });
