name: "05: Register webhook → Issue"

on:
  workflow_dispatch:
    inputs:
      worker_subdomain:
        description: 'Override workers.dev subdomain (blank = auto-derive)'
        required: false
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund

      - name: Run registration + verification, capture
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SWITCHBOT_API_TOKEN: ${{ secrets.SWITCHBOT_API_TOKEN }}
          SWITCHBOT_API_SECRET: ${{ secrets.SWITCHBOT_API_SECRET }}
          SWITCHBOT_WEBHOOK_SECRET: ${{ secrets.SWITCHBOT_WEBHOOK_SECRET }}
          SUBDOMAIN_INPUT: ${{ inputs.worker_subdomain }}
        run: |
          set +e
          LOG=/tmp/reg.log
          : > "$LOG"
          exec > >(tee -a "$LOG") 2>&1

          echo "=== Determine subdomain ==="
          if [ -n "$SUBDOMAIN_INPUT" ]; then
            SUB="$SUBDOMAIN_INPUT"
            echo "Using provided: $SUB"
          else
            RESP=$(curl -sS \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")
            SUB=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('result',{}).get('subdomain',''))")
            echo "Auto-derived: $SUB"
          fi
          if [ -z "$SUB" ]; then echo "Could not determine subdomain"; exit 1; fi
          URL="https://switchbot-temperature-logger.${SUB}.workers.dev"
          echo "Worker URL: $URL"

          echo
          echo "=== Worker reachability (correct secret, ignored payload) ==="
          curl -sS -o /tmp/r -w "HTTP %{http_code}\n" \
            -X POST "${URL}/webhook/${SWITCHBOT_WEBHOOK_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"eventType":"diagnostic"}'
          cat /tmp/r; echo

          echo
          echo "=== Run register-webhook.js ==="
          WORKER_URL="$URL" node scripts/register-webhook.js

      - name: Scrub secrets
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SWITCHBOT_API_TOKEN: ${{ secrets.SWITCHBOT_API_TOKEN }}
          SWITCHBOT_API_SECRET: ${{ secrets.SWITCHBOT_API_SECRET }}
          SWITCHBOT_WEBHOOK_SECRET: ${{ secrets.SWITCHBOT_WEBHOOK_SECRET }}
          DEVICES: ${{ secrets.DEVICES }}
        run: |
          python3 - <<'PY'
          import os
          try:
              with open('/tmp/reg.log') as f: t = f.read()
          except FileNotFoundError:
              t = '(no log)'
          for n in ['CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID','SWITCHBOT_API_TOKEN','SWITCHBOT_API_SECRET','SWITCHBOT_WEBHOOK_SECRET','DEVICES']:
              v = os.environ.get(n,'')
              if v: t = t.replace(v, f'<<{n}>>')
          with open('/tmp/reg.log','w') as f: f.write(t)
          PY

      - name: Post to tracker PR (or fallback Issue)
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const post = require('./scripts/post-tracker.cjs');
            await post({ github, context, core, logPath: '/tmp/reg.log', kind: 'register-webhook' });
