name: "09: Backfill room names in D1"

on:
  workflow_dispatch:

concurrency:
  group: backfill-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund

      - name: Run backfill
        id: backfill
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SWITCHBOT_API_TOKEN: ${{ secrets.SWITCHBOT_API_TOKEN }}
          SWITCHBOT_API_SECRET: ${{ secrets.SWITCHBOT_API_SECRET }}
        run: |
          set +e
          node scripts/backfill-rooms.mjs 2>&1 | tee /tmp/backfill.log
          echo "rc=$?" >> /tmp/backfill.log

      - name: Show post-backfill stats
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          {
            echo
            echo "=== Room distribution (top 20) ==="
            npx wrangler d1 execute switchbot-logs --remote \
              --command "SELECT room, COUNT(*) AS n FROM temperature_logs GROUP BY room ORDER BY n DESC LIMIT 20"
            echo
            echo "=== Per-device/room counts ==="
            npx wrangler d1 execute switchbot-logs --remote \
              --command "SELECT device_id, room, COUNT(*) AS n FROM temperature_logs GROUP BY device_id, room ORDER BY device_id, n DESC"
          } 2>&1 | tee -a /tmp/backfill.log

      - name: Scrub secrets
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SWITCHBOT_API_TOKEN: ${{ secrets.SWITCHBOT_API_TOKEN }}
          SWITCHBOT_API_SECRET: ${{ secrets.SWITCHBOT_API_SECRET }}
          SWITCHBOT_WEBHOOK_SECRET: ${{ secrets.SWITCHBOT_WEBHOOK_SECRET }}
          DEVICES: ${{ secrets.DEVICES }}
        run: |
          python3 - <<'PY'
          import os
          try:
              with open('/tmp/backfill.log') as f: t = f.read()
          except FileNotFoundError:
              t = '(no log)'
          for n in ['CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID','SWITCHBOT_API_TOKEN','SWITCHBOT_API_SECRET','SWITCHBOT_WEBHOOK_SECRET','DEVICES']:
              v = os.environ.get(n,'')
              if v: t = t.replace(v, f'<<{n}>>')
          with open('/tmp/backfill.log','w') as f: f.write(t)
          PY

      - name: Post to tracker PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const post = require('./scripts/post-tracker.cjs');
            await post({ github, context, core, logPath: '/tmp/backfill.log', kind: 'backfill' });
