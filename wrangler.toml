name = "switchbot-temperature-logger"
main = "src/index.js"
compatibility_date = "2026-05-17"

# Cron Triggers: every 10 minutes (primary periodic sampling).
[triggers]
crons = ["*/10 * * * *"]

# Public vars (non-secret). DEVICES is a JSON string of [{deviceId, room}, ...].
[vars]
DEVICES = "[]"

# D1 database binding. First create the DB and paste the returned ID:
#   wrangler d1 create switchbot-logs
[[d1_databases]]
binding = "DB"
database_name = "switchbot-logs"
database_id = "0688f834-c392-46f9-8206-6daa5e3d5abf"

# Secrets — set via `wrangler secret put <NAME>`. Do NOT commit real values.
#   wrangler secret put SWITCHBOT_API_TOKEN
#   wrangler secret put SWITCHBOT_API_SECRET
#   wrangler secret put SWITCHBOT_WEBHOOK_SECRET
# The webhook URL registered with SwitchBot must be:
#   https://<your-worker>.workers.dev/webhook/<SWITCHBOT_WEBHOOK_SECRET>
